services:
  php-apache:
    build: .
    ports:
      - "8080:80"
    environment:
      PORT: 80
      MYSQLHOST: db
      MYSQLPORT: 3306
      MYSQLUSER: root
      MYSQLPASSWORD: ${MYSQLPASSWORD:-root}
      MYSQLDATABASE: ${MYSQLDATABASE:-barbearia_agenda}
    depends_on:
      - db

  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQLPASSWORD:-root}
      MYSQL_DATABASE: ${MYSQLDATABASE:-barbearia_agenda}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: barbearia-phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ${MYSQLPASSWORD:-root}

volumes:
  db_data:
